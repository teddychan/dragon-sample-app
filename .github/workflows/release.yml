name: Release

# Public releases of Dragon Sample App. Exactly `vX.Y.Z` tags — no prefixed family. This app used
# to publish from dragon-kit under `sample-v*`, which meant one repository owned two independently
# versioned public series; MAC-APP-RELEASE-LIFECYCLE.md now forbids that, and the tag gate rejects
# every prefixed form outright. Historical `sample-v*` tags in dragon-kit are migration data only.
#
# Pinned @v6, the first release of the mandatory tag gate. v5 is frozen and has no `verify_only`
# or `whats_new_path`, so passing them there would fail at startup — the pin and the inputs move
# together or not at all.
#
# The tag trigger is live: `build_number_offset` below settles the CFBundleVersion continuity
# problem that blocked it. A dispatch still runs verification-only by default, which is how this
# app exercises the pipeline without publishing.
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Run the gate and build, publish nothing'
        type: boolean
        default: true
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# The called workflow declares `permissions: contents: write` — it creates the GitHub Release and
# uploads the asset on THIS repo. A new GitHub repository defaults workflow permissions to
# `contents: read`, so without this block the run dies as `startup_failure` in two seconds with
# "The workflow is requesting 'contents: write', but is only allowed 'contents: read'". Every
# other Dragon caller declares it the same way; the four production repos also default to `read`.
#
# A verification-only run still writes nothing: every side-effecting step carries its own
# verify_only guard and receives an empty credential, so the grant is unused rather than relied on.
permissions:
  contents: write

jobs:
  release:
    uses: teddychan/dragon-release-ci/.github/workflows/release-macos.yml@v6
    secrets: inherit
    with:
      verify_only: ${{ inputs.verify_only }}
      build_kind: swiftpm
      swiftpm_runner: macos-26
      swiftpm_working_directory: '.'
      swiftpm_product_name: DragonAppTemplate
      swiftpm_app_name_template: 'Dragon Sample App'
      swiftpm_sparkle: true
      app_slug: dragon-sample-app
      release_title_prefix: 'Dragon Sample App'
      bot_name: 'Dragon Sample App Release Bot'
      assert_tag_matches_plist: true
      whats_new_path: Sources/DragonAppTemplate/WhatsNewConfig.swift
      # CFBundleVersion must clear the 77 already shipped from dragon-kit. Sparkle compares this
      # number (the appcast's sparkle:version), and `git rev-list --count HEAD` restarted at 1
      # when this app was extracted — so without the offset, v1.4.1 would advertise build 12 and
      # every installed copy would read it as OLDER and never offer the update. 100 + count clears
      # 77 with room to spare. Never lower this.
      build_number_offset: '100'
      appcast_repo: teddychan/dragon-sample-app
      zip_name_template: 'DragonSampleApp-{TAG}.zip'
